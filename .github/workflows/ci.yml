name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  contract-tests:
    name: Run Smart Contract Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          
      - name: Cache Cargo Registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          
      - name: Run Cargo Test
        run: cargo test --workspace

  contract-build:
    name: Build Smart Contracts (WASM)
    runs-on: ubuntu-latest
    needs: contract-tests
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          
      - name: Cache Cargo Registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          
      - name: Build WASM
        run: cargo build --workspace --target wasm32-unknown-unknown --release

  frontend-lint:
    name: Frontend Code Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Run ESLint
        run: npm run lint

  frontend-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    needs: frontend-lint
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Run Vitest
        run: npm run test

  frontend-build:
    name: Frontend Production Build
    runs-on: ubuntu-latest
    needs: [frontend-tests, contract-build]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Build Next.js App
        run: npm run build
        env:
          NEXT_PUBLIC_STELLAR_NETWORK: TESTNET
          NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
          NEXT_PUBLIC_SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
          NEXT_PUBLIC_NOTES_CONTRACT_ID: CAO6MF63ZJFSDOSEIUCZ2VHO4BJQDGAYC2EPR3GW7HWATS23VLLHADSD
          NEXT_PUBLIC_REPUTATION_CONTRACT_ID: CC5VPHTLBKAZA7F3LF7W3DLMNTGYCPLS27W5QDLJMUEHMDRPROEW2WI3
          NEXT_PUBLIC_CONTRACT_ID: CAO6MF63ZJFSDOSEIUCZ2VHO4BJQDGAYC2EPR3GW7HWATS23VLLHADSD
